[project]
name = "knowledge-book"
version = "0.1.0"
description = "Enterprise Engineering Knowledge Book: curriculum modules and reference artifacts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Data modeling & validation
    "pydantic>=2.7.0",
    # HTTP client & resilience
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    # Declarative parsing & schemas
    "pyyaml>=6.0.1",
    # Imported directly by track artifacts
    "numpy>=1.26.0",
    "redis>=5.0.0",
    "fastapi>=0.111.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = false
