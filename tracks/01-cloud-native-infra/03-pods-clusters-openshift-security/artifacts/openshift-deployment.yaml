apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-banking-api
  namespace: prod-banking-core
  labels:
    app.kubernetes.io/name: secure-banking-api
    app.kubernetes.io/part-of: core-banking-platform
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-banking-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-banking-api
    spec:
      serviceAccountName: secure-banking-sa
      terminationGracePeriodSeconds: 45
      # OpenShift Pod-Level Security Context
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/prod-banking-core/secure-banking-api:v2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
              ephemeral-storage: "1Gi"
          # Container-Level Hardening satisfying restricted-v2 SCC
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz/liveness
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                # Invariant: Allow Ingress router to unregister endpoint before SIGTERM
                command: ["/bin/sh", "-c", "sleep 15"]
          volumeMounts:
            - name: ephemeral-scratch
              mountPath: /tmp
            - name: tls-certs
              mountPath: /etc/tls/certs
              readOnly: true
      volumes:
        - name: ephemeral-scratch
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: tls-certs
          secret:
            secretName: banking-api-tls
            defaultMode: 0400
